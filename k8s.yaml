apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-bill-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-bill-tracker
  template:
    metadata:
      labels:
        app: expense-bill-tracker
    spec:
      containers:
        - name: expense-bill-tracker
          image: expense-bill-tracker:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: expense-bill-tracker-service
spec:
  type: NodePort
  selector:
    app: expense-bill-tracker
  ports:
    - port: 80
      targetPort: 80